<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Only You · Executive &amp; Production Macro Dashboard</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e4e9f0;
      --border-strong: #d0d8e4;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);

      /* Module Brand Accents (refined from original app) */
      --ctrl: #15803d;
      --ctrl-soft: #ecfdf5;
      --ctrl-border: #bbf7d0;

      --prod: #d95d2b;
      --prod-soft: #fff4ed;
      --prod-border: #fed7aa;

      --hr: #6d28d9;
      --hr-soft: #f5f3ff;
      --hr-border: #ddd6fe;

      --smart: #1d6fe2;
      --smart-soft: #eff6ff;
      --smart-border: #bfdbfe;

      /* Department Accents */
      --dept-tessitura: #8c5a44;
      --dept-confezione: #b4232c;
      --dept-sartoria: #d95d2b;
      --dept-stiro: #15803d;
      --dept-lavanderia: #1d6fe2;
      --dept-imballo: #7c5643;
      --dept-report: #6d28d9;

      /* Semantic */
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --sidebar-w: 262px;
      --topbar-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* App Shell */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: #0f172a;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .sidebar-brand {
      height: var(--topbar-h);
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
    }
    .brand-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .nav-section-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 700;
      padding: 12px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
      margin-bottom: 2px;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }
    .nav-item.active {
      background: rgba(255, 255, 255, 0.13);
      color: #ffffff;
      font-weight: 600;
    }
    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      font-weight: 600;
    }
    .nav-badge.warn {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    .nav-sublist {
      margin: 2px 0 8px 18px;
      padding-left: 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }
    .nav-subitem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 12.5px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .nav-subitem:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }
    .nav-subitem.active {
      color: #ffffff;
      background: rgba(217, 93, 43, 0.22);
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      border: none;
      width: 100%;
      color: inherit;
      text-align: left;
    }
    .user-card:hover { background: rgba(255, 255, 255, 0.09); }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d95d2b, #6d28d9);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    /* Main Content */
    .main {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Topbar */
    .topbar {
      height: var(--topbar-h);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .crumb-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 6px;
    }
    .crumb-btn:hover { background: var(--bg); color: var(--text); }
    .crumb-current {
      color: var(--text);
      font-weight: 600;
      padding: 3px 6px;
    }

    .layer-switcher {
      display: inline-flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .layer-pill {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .layer-pill.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .layer-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #334155;
    }
    .layer-pill.active .layer-tag {
      background: #0f172a;
      color: #ffffff;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-select {
      height: 34px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
    }
    .control-select:focus { outline: 2px solid #cbd5e1; }

    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 6px 9px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .lang-btn.active {
      background: #0f172a;
      color: #ffffff;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ok);
      background: var(--ok-bg);
      padding: 5px 10px;
      border-radius: 99px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Workspace Content */
    .content {
      padding: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-kicker {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .page-subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s ease;
    }
    .btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); }
    .btn-primary {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    .btn-primary:hover { background: #1e293b; }

    /* KPI Strip */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .kpi-value-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .delta {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .delta.up { background: var(--ok-bg); color: var(--ok); }
    .delta.warn { background: var(--warn-bg); color: var(--warn); }
    .delta.down { background: var(--danger-bg); color: var(--danger); }
    .kpi-foot {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Layer 1: 4 Principal Modules Grid (Minimalist) */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }
    .module-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 28px 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 24px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .module-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
    }
    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }
    .module-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .module-id {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .module-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .module-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .status-dot-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .status-dot-label i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot-label.ok i { background: #16a34a; }
    .status-dot-label.warn { color: var(--warn); }
    .status-dot-label.warn i { background: #f59e0b; }

    .module-hero {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .module-hero-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .module-hero-val {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--text);
    }
    .module-hero-delta {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ok);
    }
    .module-hero-delta.muted { color: var(--text-muted); }
    .module-hero-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .status-ok { background: var(--ok-bg); color: var(--ok); }
    .status-warn { background: var(--warn-bg); color: var(--warn); }
    .status-danger { background: var(--danger-bg); color: var(--danger); }

    .module-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .module-substats {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .substat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .substat-label {
      font-size: 11px;
      color: var(--text-muted);
    }
    .substat-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .drill-link {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    /* Two-column Analytics Row */
    .split-grid {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 18px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
    }
    .panel-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .seg-tabs {
      display: inline-flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .seg-tab {
      border: none;
      background: transparent;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
    }
    .seg-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* Alert Feed */
    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .alert-item:hover {
      background: #ffffff;
      border-color: var(--border-strong);
    }
    .alert-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .alert-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .alert-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Layer 2: Textile Flow Pipeline */
    .pipeline-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .pipeline-steps {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
      position: relative;
    }
    .pipe-step {
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
    }
    .pipe-step:hover {
      border-color: var(--text);
      background: #ffffff;
      transform: translateY(-2px);
    }
    .pipe-step.bottleneck {
      border-color: #f59e0b;
      background: #fffbeb;
    }
    .pipe-num {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .pipe-name {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pipe-wip {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
    }
    .pipe-eff {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* Layer 2: Department Cards Grid */
    .dept-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .dept-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      border-top: 4px solid var(--dept-color);
    }
    .dept-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
      border-top-color: var(--dept-color);
    }
    .dept-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .dept-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dept-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: var(--dept-color);
      flex-shrink: 0;
    }
    .dept-name {
      font-size: 16px;
      font-weight: 700;
    }
    .dept-sub {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .dept-kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .dept-kpi {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 10px;
    }
    .dept-kpi-l { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .dept-kpi-v { font-size: 16px; font-weight: 700; margin-top: 2px; color: var(--text); }

    .dept-progress-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .dept-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .progress-track {
      height: 7px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
    }

    .dept-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Data Table for secondary Layer 2 views */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
    }
    .data-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--surface-subtle); }

    /* Report Quick Cards */
    .report-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .report-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-subtle);
    }
    .report-item strong { font-size: 13px; display: block; }
    .report-item span { font-size: 11.5px; color: var(--text-muted); }

    /* Drill-Down Drawer (Layer 3 preview — organized modules!) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(560px, 94vw);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      z-index: 70;
      transform: translateX(100%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .drawer-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--text-secondary);
    }
    .close-btn:hover { background: var(--bg); color: var(--text); }

    .mod-group {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: var(--surface-subtle);
    }
    .mod-group-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .mod-chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .mod-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .mod-chip:hover {
      border-color: #0f172a;
      box-shadow: var(--shadow-sm);
    }
    .mod-chip-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .mod-chip-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: #0f172a;
      color: #ffffff;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 90;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Chart Tooltip */
    .chart-wrap { position: relative; width: 100%; }
    .chart-tooltip {
      position: absolute;
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      z-index: 20;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
    }

    /* Minimalist COAN & HR Layout Helpers */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .filter-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-chip {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 99px;
    }
    .coan-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .coan-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .coan-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--ctrl);
      background: var(--ctrl-soft);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .coan-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .coan-cols {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding-top: 4px;
    }
    .coan-col-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .coan-col-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-top: 2px;
    }
    .coan-deltas {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
    }
    .hbar-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hbar-row {
      display: grid;
      grid-template-columns: 120px 1fr 56px;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .hbar-track {
      height: 10px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
      position: relative;
    }
    .hbar-fill {
      height: 100%;
      border-radius: 99px;
    }
    .hbar-target {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #0f172a;
      opacity: 0.45;
    }
    .l3-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .l3-table th {
      text-align: right;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      padding: 6px 6px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .l3-table th:first-child { text-align: left; padding-left: 0; }
    .l3-table td {
      padding: 7px 6px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      color: var(--text);
    }
    .l3-table td:first-child { text-align: left; padding-left: 0; font-weight: 500; }
    .l3-table tr:last-child td { border-bottom: none; }
    .impact-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .impact-neg { background: var(--danger-bg); color: var(--danger); }
    .impact-pos { background: var(--ok-bg); color: var(--ok); }
    .impact-neutral { background: var(--surface-subtle); color: var(--text-secondary); border: 1px solid var(--border); }

    /* Responsive */
    @media (max-width: 1180px) {
      .kpi-grid, .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dept-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pipeline-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .split-grid, .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .modules-grid { grid-template-columns: 1fr; }
      .layer-switcher { display: none; }
    }
    @media (max-width: 640px) {
      .kpi-grid, .grid-3, .dept-grid, .pipeline-steps { grid-template-columns: 1fr; }
      .mini-dept-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- Main Workspace -->

  <!-- Layer 3 Drill-Down Drawer -->

  <div class="toast" id="toast"></div>

  <script>

    function t(key) { return I18N[state.lang][key] || key; }

    // =========================================================
    // MOCK DATA ENGINE (scales cleanly by Plant & Period)
    // =========================================================
    const PLANT_MULT = { all: 1, 'eu-nord': 0.58, 'eu-sud': 0.42 };
    const PERIOD_MULT = { today: 1, week: 6.4, month: 25.5 };
    const PLANT_OEE_OFFSET = { all: 0, 'eu-nord': 1.8, 'eu-sud': -2.1 };

    function scaleInt(base) {
      return Math.round(base * PLANT_MULT[state.plant] * PERIOD_MULT[state.period]);
    }
    function scaleFleet(base) {
      return Math.max(1, Math.round(base * PLANT_MULT[state.plant]));
    }
    function clampPct(v) {
      return Math.min(99.5, Math.max(52, +(v + PLANT_OEE_OFFSET[state.plant]).toFixed(1)));
    }
    function fmtNum(n) {
      return n.toLocaleString(state.lang === 'it' ? 'it-IT' : 'en-US');
    }

    function getDepartments() {
      return [
        {
          id: 'tessitura',
          name: 'Tessitura',
          enName: 'Knitting / Weaving',
          color: '#8c5a44',

    // =========================================================
    // SVG SPARKLINE HELPER
    // =========================================================
    function sparklineSVG(values, color, width = 96, height = 28) {
      const min = Math.min(...values) - 3;
      const max = Math.max(...values) + 3;
      const step = width / (values.length - 1);
      const pts = values.map((v, i) => {
        const x = +(i * step).toFixed(1);
        const y = +(height - ((v - min) / (max - min)) * (height - 4) - 2).toFixed(1);
        return `${x},${y}`;
      });
      return `
        <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" fill="none" aria-hidden="true">
          <polyline points="${pts.join(' ')}" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${pts[pts.length - 1].split(',')[0]}" cy="${pts[pts.length - 1].split(',')[1]}" r="3" fill="${color}"/>
        </svg>
      `;
    }

    function renderProdCompareChart() {
      const container = document.getElementById('prodCompareChart');
      if (!container) return;
      const depts = getDepartments();
      const metric = state.prodChartMetric;
      const values = depts.map(d => metric === 'output' ? d.output : (metric === 'oee' ? d.oee : d.wip));
      const maxVal = metric === 'oee' ? 100 : Math.max(...values) * 1.18;

      const W = 640, H = 220, padL = 48, padR = 20, padT = 18, padB = 34;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const stepX = plotW / depts.length;

      const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
        const y = padT + plotH - f * plotH;
        const v = Math.round(maxVal * f);
        return `
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-dasharray="3 3"/>
          <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#94a3b8">${metric === 'oee' ? v + '%' : (v >= 1000 ? (v/1000).toFixed(1) + 'k' : v)}</text>
        `;
      }).join('');

      const bars = depts.map((d, i) => {
        const v = values[i];
        const bw = stepX * 0.52;
        const x = padL + i * stepX + (stepX - bw) / 2;
        const h = (v / maxVal) * plotH;
        const y = padT + plotH - h;
        const fill = d.bottleneck && metric !== 'output' ? '#f59e0b' : d.color;
        const tipVal = metric === 'oee' ? `${v}%` : `${fmtNum(v)} ${t('pcs')}`;
        return `
          <g style="cursor:pointer" onclick="openDeptDrawer('${d.id}')"
             onmouseenter="showChartTip(event, 'prodTip', '${d.name}: ${tipVal}')"
             onmouseleave="hideChartTip('prodTip')">
            <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="7" fill="${fill}" opacity="0.9"/>
            <text x="${(x + bw / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">${metric === 'oee' ? v + '%' : fmtNum(v)}</text>
            <text x="${(x + bw / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">${d.name}</text>
          </g>
        `;
      }).join('');

      container.innerHTML = `
        <div class="chart-tooltip" id="prodTip"></div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
          ${grid}
          ${bars}
        </svg>
      `;
    }

          <table class="data-table">
            <thead>
              <tr>
                <th>KPI</th>

              ${kpiRows.map(r => `

    function renderHRTrendChart() {
      const container = document.getElementById('hrTrendChart');
      if (!container) return;
      const months = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov'];
      const ass = [4.6, 4.7, 5.0, 4.8, 4.7, 4.6, 4.5, 4.6, 4.5, 4.4, 4.2];
      const turn = [10.5, 11.0, 11.4, 11.6, 11.9, 12.2, 12.0, 12.3, 12.5, 11.8, 12.3];

      const W = 540, H = 220, padL = 38, padR = 16, padT = 18, padB = 30;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const maxY = 14;
      const xAt = (i) => padL + (i / (months.length - 1)) * plotW;
      const yAt = (v) => padT + plotH - (v / maxY) * plotH;

      const grid = [0, 5, 10, 14].map(v => {
        const y = yAt(v).toFixed(1);
        return `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${v === 5 ? '#94a3b8' : '#e2e8f0'}" stroke-dasharray="${v === 5 ? '5 4' : '3 3'}"/>
          <text x="${padL - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#94a3b8">${v}%</text>
        `;
      }).join('');

      const assPts = ass.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
      const turnPts = turn.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');

      const dots = months.map((m, i) => `
        <circle cx="${xAt(i).toFixed(1)}" cy="${yAt(ass[i]).toFixed(1)}" r="3.8" fill="#fff" stroke="#6d28d9" stroke-width="2.2"
          onmouseenter="showChartTip(event, 'hrTip', '${m} · Assenteismo: ${ass[i]}% · Turnover: ${turn[i]}%')"
          onmouseleave="hideChartTip('hrTip')" style="cursor:pointer"/>
        <circle cx="${xAt(i).toFixed(1)}" cy="${yAt(turn[i]).toFixed(1)}" r="3.8" fill="#fff" stroke="#d95d2b" stroke-width="2.2"
          onmouseenter="showChartTip(event, 'hrTip', '${m} · Assenteismo: ${ass[i]}% · Turnover: ${turn[i]}%')"
          onmouseleave="hideChartTip('hrTip')" style="cursor:pointer"/>
        <text x="${xAt(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="#64748b">${m}</text>
      `).join('');

      container.innerHTML = `
        <div class="chart-tooltip" id="hrTip"></div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
          ${grid}
          <polyline points="${assPts}" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="${turnPts}" fill="none" stroke="#d95d2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          ${dots}
        </svg>
      `;
    }

      content.innerHTML = `
        <div class="page-header">

            <div class="page-kicker" style="color:var(--smart)">${t('smartKicker')}</div>
            <h1 class="page-title">${t('smartTitle')}</h1>
            <p class="page-subtitle">${t('smartSub')}</p>
          </div>
          <button class="btn" onclick="navigate('macro')">${t('backMacroBtn')}</button>
        </div>

        <section class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-top"><span>${state.lang === 'it' ? 'Macchine Connesse IoT' : 'Connected IoT Fleet'}</span></div>

          <div class="kpi-card">
            <div class="kpi-top"><span>${state.lang === 'it' ? 'Intensità Energetica' : 'Energy Intensity'}</span></div>

            <div class="kpi-value-row"><span class="kpi-value tabular">2</span><span class="delta warn">${state.lang === 'it' ? 'Stiro · Vapore' : 'Pressing · Steam'}</span></div>
            <div class="kpi-foot">${state.lang === 'it' ? 'Intervento pianificato' : 'Scheduled service'}</div>

        </section>

        <section class="panel">
          <div class="panel-head">
            <h3 class="panel-title">${state.lang === 'it' ? 'Telemetria & Consumi per Reparto' : 'Telemetry & Energy by Department'}</h3>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>${state.lang === 'it' ? 'Reparto' : 'Department'}</th>
                <th>${state.lang === 'it' ? 'Unità Attive' : 'Active Units'}</th>
                <th>${state.lang === 'it' ? 'Consumo (kWh)' : 'Energy (kWh)'}</th>
                <th>${state.lang === 'it' ? 'Stato Sensori' : 'Sensor Health'}</th>
              </tr>
            </thead>
            <tbody>
              ${depts.map(d => `
                <tr>
                  <td><strong>${d.name}</strong></td>
                  <td class="tabular">${d.activeUnits}</td>
                  <td class="tabular">${fmtNum(d.energyKwh)} kWh</td>
                  <td><span class="status-pill ${d.bottleneck ? 'status-warn' : 'status-ok'}">${d.bottleneck ? (state.lang === 'it' ? '2 Alert Vapore' : '2 Steam Alerts') : 'Online 100%'}</span></td>
                </tr>

    // =========================================================
    // LAYER 3 DRILL-DOWN DRAWER (shows how legacy tiles become organized)
    // =========================================================
    function openDeptDrawer(deptId) {
      const dept = getDepartments().find(d => d.id === deptId);
      if (!dept) return;
      state.activeDeptDrawer = deptId;
      renderSidebar();

      document.getElementById('drawerKicker').textContent = `Layer 3 · ${t('prodName')} / ${dept.name}`;
      document.getElementById('drawerTitle').textContent = `${dept.name} — ${state.lang === 'it' ? 'Macro Dati & Moduli' : 'Macro Data & Modules'}`;

      const body = document.getElementById('drawerBody');
      body.innerHTML = `
        <div class="dept-kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
          <div class="dept-kpi">
            <div class="dept-kpi-l">${t('deptOutput')}</div>
            <div class="dept-kpi-v tabular">${fmtNum(dept.output)}</div>
          </div>
          <div class="dept-kpi">
            <div class="dept-kpi-l">OEE</div>
            <div class="dept-kpi-v tabular" style="color:${dept.status === 'warn' ? 'var(--warn)' : dept.color}">${dept.oee}%</div>
          </div>
          <div class="dept-kpi">
            <div class="dept-kpi-l">WIP</div>
            <div class="dept-kpi-v tabular">${fmtNum(dept.wip)}</div>
          </div>
        </div>

        <div style="font-size:12.5px;color:var(--text-secondary);background:var(--surface-subtle);border-left:3px solid ${dept.color};padding:10px 12px;border-radius:8px">
          ${state.lang === 'it' ? dept.noteIt : dept.noteEn}
        </div>

        <div style="font-size:12.5px;font-weight:600;color:var(--text-muted)">${t('drawerNote')}</div>

        ${dept.moduleGroups.map(g => `
          <div class="mod-group">
            <div class="mod-group-title">${state.lang === 'it' ? g.groupIt : g.groupEn}</div>
            <div class="mod-chips">
              ${g.items.map(item => `
                <button class="mod-chip" onclick="showToast('${dept.name} → ${item.name} (${state.lang === 'it' ? 'modulo operativo collegato' : 'linked operational module'})')">
                  <span class="mod-chip-name">${item.name}</span>
                  <span class="mod-chip-meta">${state.lang === 'it' ? item.metaIt : item.metaEn}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('')}
      `;

      document.getElementById('drawerBackdrop').classList.add('open');
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'false');
    }

    function openDeptFromSidebar(deptId) {
      if (state.view !== 'produzione') {
        state.view = 'produzione';
        render();
      }
      openDeptDrawer(deptId);
      document.getElementById('sidebar').classList.remove('open');
    }

    function closeDrawer() {
      state.activeDeptDrawer = null;
      document.getElementById('drawerBackdrop').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'true');
      renderSidebar();
    }

    // =========================================================
    // INTERACTIONS & HELPERS
    // =========================================================
    function navigate(view) {
      state.view = view;
      closeDrawer();
      document.getElementById('sidebar').classList.remove('open');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setPlant(val) { state.plant = val; render(); }
    function setPeriod(val) { state.period = val; render(); }
    function setProdMetric(m, btn) {
      state.prodChartMetric = m;
      renderProdCompareChart();
      document.querySelectorAll('.seg-tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function setLang(lang) {
      state.lang = lang;
      document.getElementById('lang-it').classList.toggle('active', lang === 'it');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      render();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function showChartTip(evt, tipId, text) {
      const tip = document.getElementById(tipId);
      if (!tip) return;
      const rect = tip.parentElement.getBoundingClientRect();
      tip.textContent = text;
      tip.style.left = Math.min(rect.width - 190, Math.max(8, evt.clientX - rect.left + 12)) + 'px';
      tip.style.top = Math.max(8, evt.clientY - rect.top - 36) + 'px';
      tip.style.opacity = '1';
    }
    function hideChartTip(tipId) {
      const tip = document.getElementById(tipId);
      if (tip) tip.style.opacity = '0';
    }

    let toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
    }

    function render() {
      renderSidebar();
      renderTopbar();
      if (state.view === 'macro') renderMacroView();
      else if (state.view === 'produzione') renderProduzioneView();
      else if (state.view === 'controllo') renderControlloView();
      else if (state.view === 'controllo-l3') renderControlloL3View();
      else if (state.view === 'hr') renderHRView();
      else if (state.view === 'smart') renderSmartView();
    }

    // Escape closes drawer
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    // Initial render
    render();
  </script>
</body>
